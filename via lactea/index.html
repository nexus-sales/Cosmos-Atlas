<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmos App - Bóveda y Vía Láctea</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="space"></canvas>

    <button class="menu-btn">☰</button>

    <div class="search">
      <span>⌕</span>
      <input placeholder="Buscar objetos..." />
    </div>

    <aside class="sidebar">
      <button>★<small>Explorar</small></button>
      <button>🔭<small>Telescopio</small></button>
      <button>👁<small>Observación</small></button>
      <button>▣<small>Colección</small></button>
    </aside>

    <div class="zoom">
      <button>+</button>
      <input type="range" min="1" max="3" step="0.01" value="1" id="zoomSlider" />
      <button>−</button>
    </div>

    <div class="horizon"></div>

    <div class="compass">
      <span>E</span>
      <span>SE</span>
      <strong>▼<br />S</strong>
      <span>SW</span>
      <span>W</span>
    </div>

    <section class="info-card">
      <div class="galaxy-icon"></div>
      <div>
        <h3>Vía Láctea</h3>
        <p class="type">Galaxia</p>
        <p>Nuestra galaxia, un sistema espiral que contiene miles de millones de estrellas, incluido nuestro Sol.</p>
      </div>
      <footer>Más información <span>›</span></footer>
    </section>

    <nav class="bottom-nav">
      <button>▰<span>Capas</span></button>
      <button>✣<span>Constelaciones</span></button>
      <button class="active">●<span>Vista</span></button>
      <button>☁<span>Tiempo</span></button>
      <button>☷<span>Filtros</span></button>
    </nav>

    <section class="time-card">
      <h2>22:30</h2>
      <p>24 Mayo 2024</p>
      <button>▶ Tiempo</button>
    </section>

    <script src="./app.js"></script>
  </body>
</html>
